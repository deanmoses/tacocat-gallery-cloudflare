name: Browser performance runs

# The album journey in DebugBear's real Chrome, on this site and the AWS one, cold and then warm, started by hand.
# The production Worker's cron starts the scheduled runs, since GitHub started this workflow's schedule hours late.
# `node api/scripts/debugbear.ts report` prints the results.
on:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    HUSKY: 0

jobs:
    run:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
              with:
                  scripts: 'false'
            - name: Run the journey on every DebugBear page
              env:
                  DEBUGBEAR_API_KEY: ${{ secrets.DEBUGBEAR_API_KEY }}
              run: node api/scripts/debugbear.ts run
