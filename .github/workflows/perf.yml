name: Browser performance runs

# The album journey in DebugBear's real Chrome, on this site and the AWS one, cold and then warm. The times keep two
# hours from the idle probes' runs (00:23, 01:23, 03:23, 07:23 and 15:23 UTC) so neither kind of run finds the site
# just warmed by the other. `node api/scripts/debugbear.ts report` prints the results.
on:
    schedule:
        - cron: '23 5,11,19,22 * * *'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    HUSKY: 0

jobs:
    run:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
              with:
                  scripts: 'false'
            - name: Run the journey on every DebugBear page
              env:
                  DEBUGBEAR_API_KEY: ${{ secrets.DEBUGBEAR_API_KEY }}
              run: node api/scripts/debugbear.ts run
