name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # A superseded pull request run can go; a push to main runs to completion so main's status is never left unknown.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    HUSKY: 0 # The hooks run the same scripts as this workflow, on the developer's machine.

jobs:
    # The check branch protection requires: the same lint, type check and tests as `npm run quality`, over the whole
    # repo. The tools it needs beyond npm are installed pinned and checksummed by scripts/install-lint-tools.sh.
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  # gitleaks scans every commit, and the migration checks diff against the branch the change is going into.
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            # Ahead of npm ci, whose prepare script installs the browser: restoring afterwards would be too late to
            # skip the download.
            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  # A lockfile change misses the exact key, so fall back to the last browsers cached: a dependency bump
                  # rarely moves Playwright.
                  restore-keys: playwright-${{ runner.os }}-

            - name: Install lint tools
              run: scripts/install-lint-tools.sh

            - name: Install dependencies
              run: npm ci

            - name: Lint
              env:
                  LINT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
              run: npm run lint

            - name: Type check
              run: npm run check

            - name: Test
              run: npm test

            # Uploaded on success too: a run that only passed on retry is exactly the one worth looking at.
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      e2e/playwright-report/
                  if-no-files-found: ignore
                  retention-days: 7
