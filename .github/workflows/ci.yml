name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # A superseded pull request run can go; a push to main runs to completion so main's status is never left unknown.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    HUSKY: 0 # The hooks run the same scripts as this workflow, on the developer's machine.

jobs:
    # A change to markdown alone gets the markdown checks alone. A `paths-ignore` on the trigger would skip the run
    # instead, but a run that never starts never reports, and branch protection needs a check that always does:
    # merge-ok, below.
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read # paths-filter lists a pull request's files through the API
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0 # on push, paths-filter diffs against the previous commit
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
              id: filter
              with:
                  predicate-quantifier: every
                  filters: |
                      code:
                        - '**'
                        - '!**/*.md'
                        - '!LICENSE'

    # Lint, type check and tests each on their own runner, so a run takes as long as the slowest of them rather than
    # their sum. Together they are what `npm run quality` runs locally, over the whole repo.
    lint:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  # gitleaks scans every commit, and the migration checks diff against the branch the change is going into.
                  fetch-depth: 0
            - uses: ./.github/actions/setup
            # The system tools the lint needs beyond npm, pinned and checksummed.
            - run: scripts/install-lint-tools.sh
            - name: Lint
              env:
                  LINT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
              run: npm run lint

    check:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Type check
              run: npm run check

    # The Worker's tests and the front end's on separate runners: each side's suites take about as long as the other's,
    # and both start the site, so neither waits for the other's build.
    test-api:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Test shared and api
              run: scripts/test.sh shared api

    test-web:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Test web and e2e
              run: scripts/test.sh web e2e
            # Uploaded on success too: a run that only passed on retry is exactly the one worth looking at.
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      e2e/playwright-report/
                  if-no-files-found: ignore
                  retention-days: 7

    lint-docs:
        needs: changes
        if: needs.changes.outputs.code == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
              with:
                  scripts: 'false'
            - name: Lint markdown
              run: scripts/lint.sh --docs

    # The check branch protection requires. It passes when the jobs the change called for all succeeded: lint, check
    # and the two test jobs for a code change, lint-docs otherwise. Anything else, a detector that answered nothing
    # included, fails: this must not fail open.
    merge-ok:
        needs: [changes, lint, check, test-api, test-web, lint-docs]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check required jobs
              env:
                  CHANGES: ${{ needs.changes.result }}
                  CODE: ${{ needs.changes.outputs.code }}
                  LINT: ${{ needs.lint.result }}
                  CHECK: ${{ needs.check.result }}
                  TEST_API: ${{ needs.test-api.result }}
                  TEST_WEB: ${{ needs.test-web.result }}
                  LINT_DOCS: ${{ needs.lint-docs.result }}
              run: |
                  if [ "$CHANGES" != success ]; then
                      echo "changes did not succeed ($CHANGES)"
                      exit 1
                  fi
                  case "$CODE" in
                  true)
                      for job in "lint:$LINT" "check:$CHECK" "test-api:$TEST_API" "test-web:$TEST_WEB"; do
                          if [ "${job#*:}" != success ]; then
                              echo "code changed but ${job%%:*} did not succeed (${job#*:})"
                              exit 1
                          fi
                      done
                      echo "code changed; lint, check, test-api and test-web passed"
                      ;;
                  false)
                      if [ "$LINT_DOCS" != success ]; then
                          echo "docs changed but lint-docs did not succeed ($LINT_DOCS)"
                          exit 1
                      fi
                      echo "docs changed; lint-docs passed"
                      ;;
                  *)
                      echo "unexpected code output '$CODE'"
                      exit 1
                      ;;
                  esac
